<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog — OrderDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#245f4f', light: '#e8efe9' },
            accent: '#d36b37',
            ink: '#1e1b16',
            muted: '#71685d',
            surface: '#fffaf0',
            line: '#e1d7c7',
            bg: '#f6f3ed',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { background: radial-gradient(circle at top left, #fbe6c2, transparent 32rem), #f6f3ed; }
  </style>
</head>
<body class="font-sans text-ink min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-56 border-r border-line bg-surface/80 backdrop-blur p-5 flex flex-col gap-1 shrink-0">
      <div class="mb-6">
        <span class="text-xs font-extrabold uppercase tracking-widest text-accent">OrderDesk</span>
      </div>
      <a href="#" class="px-3 py-2 rounded-xl text-sm text-muted hover:bg-brand-light/60 transition">Dashboard</a>
      <a href="#" class="px-3 py-2 rounded-xl text-sm text-muted hover:bg-brand-light/60 transition">Customers</a>
      <a href="#" class="px-3 py-2 rounded-xl text-sm font-semibold bg-brand-light text-brand transition">Products</a>
      <a href="#" class="px-3 py-2 rounded-xl text-sm text-muted hover:bg-brand-light/60 transition">Orders</a>
      <a href="#" class="px-3 py-2 rounded-xl text-sm text-muted hover:bg-brand-light/60 transition">Audit Log</a>
    </aside>
    <main class="flex-1 p-8 max-w-5xl">
      <div class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight">Product Catalog</h1>
        <p class="text-muted text-sm mt-1">Active products available for order placement</p>
      </div>
      <div class="bg-surface/86 border border-line rounded-2xl shadow-lg shadow-amber-900/[.09] overflow-hidden">
        <table class="w-full text-sm" id="productsTable">
          <thead>
            <tr class="border-b border-line bg-surface/60">
              <th class="text-left px-5 py-3.5 font-semibold text-muted text-xs uppercase tracking-wider">Product Name</th>
              <th class="text-left px-5 py-3.5 font-semibold text-muted text-xs uppercase tracking-wider">SKU</th>
              <th class="text-right px-5 py-3.5 font-semibold text-muted text-xs uppercase tracking-wider">Unit Price</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="hidden py-16 text-center">
          <div class="text-4xl mb-3">📦</div>
          <p class="text-muted font-medium">No active products</p>
          <p class="text-muted text-xs mt-1">All products are currently deactivated.</p>
        </div>
      </div>
      <div class="mt-4 flex justify-between items-center px-1">
        <p class="text-xs text-muted" id="countLabel">Showing 4 active products</p>
        <button id="toggleBtn" onclick="toggleEmpty()" class="text-xs text-brand underline cursor-pointer bg-transparent border-0">Toggle empty state</button>
      </div>
    </main>
  </div>
  <script>
    const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    function cents(v) { return formatter.format(v / 100); }
    const products = [
      { id: 2, sku: 'SKU-LAMP-002',  name: 'Desk Lamp',      unitPriceCents: 4599  },
      { id: 3, sku: 'SKU-CHAIR-003', name: 'Ergo Chair',      unitPriceCents: 18999 },
      { id: 1, sku: 'SKU-BOARD-001', name: 'Planning Board',  unitPriceCents: 2499  },
      { id: 4, sku: 'SKU-CABLE-004', name: 'USB-C Cable',     unitPriceCents: 1299  },
    ];
    const tbody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');
    const countLabel = document.getElementById('countLabel');
    let showingEmpty = false;
    function render(data) {
      if (data.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        countLabel.textContent = 'No active products';
        return;
      }
      emptyState.classList.add('hidden');
      countLabel.textContent = `Showing ${data.length} active product${data.length !== 1 ? 's' : ''}`;
      tbody.innerHTML = data.map(p => `
        <tr class="border-b border-line/60 last:border-b-0 hover:bg-brand-light/30 transition-colors">
          <td class="px-5 py-3.5 font-medium">${p.name}</td>
          <td class="px-5 py-3.5">
            <code class="text-xs bg-bg px-2 py-0.5 rounded-lg border border-line font-mono">${p.sku}</code>
          </td>
          <td class="px-5 py-3.5 text-right font-semibold text-brand">${cents(p.unitPriceCents)}</td>
        </tr>
      `).join('');
    }
    function toggleEmpty() {
      showingEmpty = !showingEmpty;
      render(showingEmpty ? [] : products);
    }
    render(products);
  </script>
</body>
</html>
