<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — OrderDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#245f4f', light: '#e8efe9' },
            accent: '#d36b37',
            surface: '#fffaf0',
            muted: '#71685d',
            ink: '#1e1b16',
            line: '#e1d7c7',
            bg: '#f6f3ed',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { background: radial-gradient(circle at top left, #fbe6c2, transparent 32rem), #f6f3ed; }
  </style>
</head>
<body class="text-ink font-sans min-h-screen">

  <!-- Navigation -->
  <nav class="border-b border-line bg-surface/80 backdrop-blur-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-6">
      <span class="font-extrabold text-lg tracking-tight text-brand">OrderDesk</span>
      <div class="flex gap-1 text-sm">
        <a href="#" class="px-3 py-1.5 rounded-lg text-muted hover:bg-brand/5 transition">Dashboard</a>
        <a href="#" class="px-3 py-1.5 rounded-lg bg-brand/10 text-brand font-semibold">Orders</a>
        <a href="#" class="px-3 py-1.5 rounded-lg text-muted hover:bg-brand/5 transition">Customers</a>
        <a href="#" class="px-3 py-1.5 rounded-lg text-muted hover:bg-brand/5 transition">Products</a>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <!-- Page header with filter -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Orders</h1>
        <p class="text-sm text-muted mt-0.5">Manage and track customer orders</p>
      </div>
      <select id="statusFilter" class="border border-line rounded-xl px-4 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand/30 cursor-pointer">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="paid">Paid</option>
        <option value="shipped">Shipped</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <!-- Order cards list -->
    <div id="orderList" class="grid gap-3"></div>

    <!-- Empty state -->
    <div id="emptyState" class="hidden text-center py-16">
      <div class="text-4xl mb-3">📦</div>
      <p class="text-muted text-sm">No orders match the selected filter.</p>
    </div>
  </main>

  <script>
    const orders = [
      { id: 3, customerName: 'Maya Patel', customerEmail: 'maya@example.com', status: 'shipped', totalCents: 85992, orderDate: '2026-02-03T16:40:00Z', notes: 'Enterprise onboarding kit' },
      { id: 2, customerName: 'Noah Singh', customerEmail: 'noah@example.com', status: 'new', totalCents: 4599, orderDate: '2026-02-02T14:20:00Z', notes: 'Needs address confirmation' },
      { id: 1, customerName: 'Ava Chen', customerEmail: 'ava@example.com', status: 'paid', totalCents: 8895, orderDate: '2026-02-01T12:00:00Z', notes: 'Priority customer' },
    ];

    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    function cents(v) { return money.format((v || 0) / 100); }

    const statusStyles = {
      new:       { bg: 'bg-blue-50', text: 'text-blue-700', ring: 'ring-blue-200' },
      paid:      { bg: 'bg-emerald-50', text: 'text-emerald-700', ring: 'ring-emerald-200' },
      shipped:   { bg: 'bg-violet-50', text: 'text-violet-700', ring: 'ring-violet-200' },
      cancelled: { bg: 'bg-red-50', text: 'text-red-700', ring: 'ring-red-200' },
    };

    function badge(status) {
      const s = statusStyles[status] || statusStyles.new;
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide ring-1 ${s.bg} ${s.text} ${s.ring}">${status}</span>`;
    }

    function escapeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderOrders(filter) {
      const filtered = filter ? orders.filter(o => o.status === filter) : orders;
      const list = document.getElementById('orderList');
      const empty = document.getElementById('emptyState');

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      list.innerHTML = filtered.map(o => `
        <div class="bg-white/90 border border-line rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
          <div class="flex items-start justify-between gap-3 mb-2">
            <div class="flex items-center gap-2.5">
              <span class="font-bold text-base">#${o.id}</span>
              <span class="font-semibold text-base">${escapeHTML(o.customerName)}</span>
              ${badge(o.status)}
            </div>
            <span class="font-bold text-brand text-lg tabular-nums">${cents(o.totalCents)}</span>
          </div>
          <div class="flex items-center gap-2 text-xs text-muted">
            <span>${escapeHTML(o.customerEmail)}</span>
            <span class="text-line">·</span>
            <span>${new Date(o.orderDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} at ${new Date(o.orderDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span>
          </div>
          ${o.notes ? `<div class="mt-2 text-sm text-muted/80 bg-bg/60 rounded-lg px-3 py-1.5">${escapeHTML(o.notes)}</div>` : ''}
        </div>
      `).join('');
    }

    document.getElementById('statusFilter').addEventListener('change', (e) => {
      renderOrders(e.target.value);
    });

    renderOrders('');
  </script>
</body>
</html>
