<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderDesk — Audit Trail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-surface-50 min-h-screen">
  <nav class="bg-white border-b border-surface-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-1">
          <span class="text-lg font-bold text-gray-900">OrderDesk</span>
        </div>
        <div class="flex items-center gap-6 text-sm font-medium">
          <a href="#" class="text-gray-500 hover:text-gray-900 transition-colors">Dashboard</a>
          <a href="#" class="text-gray-500 hover:text-gray-900 transition-colors">Orders</a>
          <a href="#" class="text-gray-500 hover:text-gray-900 transition-colors">Customers</a>
          <a href="#" class="text-gray-500 hover:text-gray-900 transition-colors">Products</a>
          <a href="#" class="text-brand-600 border-b-2 border-brand-600 pb-4 -mb-[1px]">Audit Trail</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-gray-900">Audit Trail</h1>
      <p class="text-sm text-gray-500 mt-1">Order lifecycle events — most recent first (showing up to 50 entries)</p>
    </div>

    <div class="bg-white rounded-lg border border-surface-200 overflow-hidden shadow-sm">
      <table class="min-w-full divide-y divide-surface-200">
        <thead class="bg-surface-50">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Timestamp</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Entity Type</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Entity ID</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Event</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Message</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-surface-100" id="auditBody"></tbody>
      </table>
    </div>

    <div class="mt-3 text-xs text-gray-400 text-right" id="entryCount"></div>
  </main>

  <script>
    const auditData = [
      { id: 3, entityType: 'order', entityId: 3, eventType: 'status_changed', message: 'Order shipped from warehouse', createdAt: '2026-02-04T08:30:00Z' },
      { id: 2, entityType: 'order', entityId: 1, eventType: 'status_changed', message: 'Order moved to paid', createdAt: '2026-02-01T12:05:00Z' },
      { id: 1, entityType: 'order', entityId: 1, eventType: 'created', message: 'Order imported from legacy desk', createdAt: '2026-02-01T12:00:01Z' },
    ];

    function eventBadge(eventType) {
      const styles = {
        created: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        status_changed: 'bg-blue-50 text-blue-700 border-blue-200',
      };
      const style = styles[eventType] || 'bg-gray-50 text-gray-700 border-gray-200';
      const label = eventType.replace('_', ' ');
      return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium border ' + style + '">' + label + '</span>';
    }

    function entityBadge(type) {
      return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-700">' + type + '</span>';
    }

    function formatTimestamp(iso) {
      const d = new Date(iso);
      const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      return '<div class="text-sm text-gray-900">' + date + '</div><div class="text-xs text-gray-400">' + time + '</div>';
    }

    function renderTable() {
      const tbody = document.getElementById('auditBody');
      tbody.innerHTML = auditData.map(function(entry) {
        return '<tr class="hover:bg-surface-50 transition-colors">' +
          '<td class="px-4 py-3 whitespace-nowrap">' + formatTimestamp(entry.createdAt) + '</td>' +
          '<td class="px-4 py-3 whitespace-nowrap">' + entityBadge(entry.entityType) + '</td>' +
          '<td class="px-4 py-3 whitespace-nowrap"><span class="text-sm font-mono text-gray-700">#' + entry.entityId + '</span></td>' +
          '<td class="px-4 py-3 whitespace-nowrap">' + eventBadge(entry.eventType) + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600">' + entry.message + '</td>' +
        '</tr>';
      }).join('');
      document.getElementById('entryCount').textContent = 'Showing ' + auditData.length + ' of ' + auditData.length + ' entries';
    }

    renderTable();
  </script>
</body>
</html>
